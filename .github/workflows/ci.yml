# ===== SESSION 12: a NEW file =========================================
# GitHub reads every .yml file in .github/workflows/ and runs it when
# its "on" event happens. This one runs on every push, to any branch.
name: CI

on: push

jobs:
  test:
    # A fresh Linux machine from GitHub, empty except for the tools
    # GitHub installs on it. Nothing from your laptop is on it.
    runs-on: ubuntu-latest

    steps:
      # Copies this repo, at the commit that was pushed, onto the machine.
      - uses: actions/checkout@v4

      # Installs Node 22 (LTS)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs exactly what package-lock.json lists with legacy peer deps
      - run: npm ci --legacy-peer-deps

      # oxlint, the linter Vite's template set up. Warnings print but
      # do not fail the run; errors do.
      - run: npm run lint

      # The three test files. No secrets: vite.config.ts gives the
      # tests their own VITE_API_URL, and they never call the API.
      - run: npm test

      # tsc -b, then vite build: type errors anywhere in src/ fail here,
      # test files included, because tsconfig.app.json includes all of
      # src/.
      - run: npm run build
